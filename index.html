<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --soft-bg: #f4ede4;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--soft-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Dil Seçim Ekranı Tasarımı */
        .lang-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .lang-logo {
            max-width: 260px;
            width: 85%;
            height: auto;
            margin-bottom: 50px;
        }

        .lang-btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        .lang-select-btn {
            background: #ffffff;
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.2s ease;
        }

        .lang-select-btn:active {
            transform: scale(0.96);
            background: var(--dark-blue);
            color: #ffffff;
        }

        /* Ana Menü Alanı */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.3);
            background: transparent;
            position: relative;
        }

        .lang-switch-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid var(--gold);
            color: var(--dark-blue);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }
