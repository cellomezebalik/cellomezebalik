<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <!-- İkonlar için Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 3px solid var(--gold);
            background: white;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .cat-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 1px solid #eee;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .cat-card:active { transform: scale(0.95); }

        .cat-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .cat-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .social-area {
            text-align: center;
            padding: 10px 20px;
            border-top: 1px solid #eee;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .small-btn {
            text-decoration: none;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ig-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .wa-btn { background: #25d366; }
        .google-btn { background: #4285F4; margin-top: 10px; display: inline-flex; }

        .experience-text { font-size: 14px; font-weight: bold; margin-top: 15px; color: var(--dark-blue); }
        .thanks-text { font-size: 12px; font-style: italic; color: #888; margin-top: 25px; display: block; }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            overflow-y: auto;
        }

        .overlay-header {
            padding: 20px;
            background: var(--dark-blue);
            color: white;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .back-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            margin-right: 15px;
            font-weight: bold;
        }

        .product-list { padding: 20px; }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-price { font-weight: bold; color: var(--gold); }

        .raki-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px;}
        .raki-table th, .raki-table td { padding: 10px 2px; text-align: center; border-bottom: 1px solid #eee; }
        .raki-brand { text-align: left !important; font-weight: bold; color: var(--dark-blue); }
        
        .alkol-not {
            background: #fff8e1;
            padding: 10px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #856404;
            text-align: center;
            border: 1px dashed #ffeeba;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="logo.JPG" alt="Cello Logo" class="logo-img">
    </header>

    <div class="category-grid">
        <div class="cat-card" onclick="openMenu('raki-cat', 'RAKI ÇEŞİTLERİ')">
            <img src="raki.JPG" class="cat-img">
            <div class="cat-title">RAKI ÇEŞİTLERİ</div>
        </div>
        <div class="cat-card" onclick="openMenu('icecek-cat', 'İÇECEKLER')">
            <img src="icecek.JPG" class="cat-img">
            <div class="cat-title">İÇECEKLER</div>
        </div>
        <div class="cat-card" onclick="openMenu('meze-cat', 'MEZELER')">
            <img src="meze.JPG" class="cat-img">
            <div class="cat-title">MEZELER</div>
        </div>
        <div class="cat-card" onclick="openMenu('salata-cat', 'SALATALAR')">
            <img src="salata.JPG" class="cat-img">
            <div class="cat-title">SALATALAR</div>
        </div>
        <div class="cat-card" onclick="openMenu('arasicak-cat', 'ARA SICAKLAR')">
            <img src="arasicak.jpg" class="cat-img">
            <div class="cat-title">ARA SICAKLAR</div>
        </div>
        <div class="cat-card" onclick="openMenu('anayemek-cat', 'ANA YEMEKLER')">
            <img src="anayemek.JPG" class="cat-img">
            <div class="cat-title">ANA YEMEKLER</div>
        </div>
    </div>

    <!-- Sosyal Butonlar -->
    <div class="social-area">
        <div class="social-row">
            <a href="https://instagram.com/cellomezebalik" target="_blank" class="small-btn ig-btn">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/+905326771371" target="_blank" class="small-btn wa-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <div class="experience-text">Deneyiminizi Bizlerle Paylaşın</div>
        <a href="https://www.google.com/search?client=safari&hs=QYT&sca_esv=51ecd411621d9ffb&hl=tr-tr&sxsrf=ANbL-n6oga8KuMEq0cxkKBPQZQ5mMa70rg%3A1777631857006&kgmid=%2Fg%2F11f542cp71&q=Cello%20Meze%20%26%20Bal%C4%B1k&shem=rimspwouoe&shndl=30&source=sh%2Fx%2Floc%2Fact%2Fm4%2F3" target="_blank" class="small-btn google-btn">
            <i class="fab fa-google"></i> Google Yorumları
        </a>

        <span class="thanks-text">Bizleri tercih ettiğiniz için teşekkür ederiz!</span>
    </div>
</div>

<div id="overlay" class="menu-overlay">
    <div class="overlay-header">
        <button class="back-btn" onclick="closeMenu()">← Geri</button>
        <h3 id="overlay-title" style="margin:0"></h3>
    </div>
    <div id="overlay-content" class="product-list"></div>
</div>

<script>
    const menus = {
        'raki-cat': `
            <table class="raki-table">
                <tr><th>Marka</th><th>20cc</th><th>35cc</th><th>50cc</th><th>70cc</th><th>100cc</th></tr>
                <tr><td class="raki-brand">Efe Gold</td><td>650</td><td>1200</td><td>1500</td><td>2000</td><td>2500</td></tr>
                <tr><td class="raki-brand">Sarı Zeybek</td><td>750</td><td>1300</td><td>1750</td><td>2250</td><td>3000</td></tr>
                <tr><td class="raki-brand">Beylerbeyi Göbek</td><td>750</td><td>1500</td><td>1900</td><td>2400</td><td>3200</td></tr>
            </table>
            <div class="alkol-not">⚠️ Dışarıdan getirilen alkollü içecekler için servis ücreti <b>Kişi Başı 200₺</b>'dir.</div>`,
        'icecek-cat': `
            <div class="item"><span>Bira</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Kola, Fanta, Sprite, Şalgam</span><span class="item-price">75 TL</span></div>
            <div class="item"><span>Redbull</span><span class="item-price">150 TL</span></div>`,
        'meze-cat': `
            <div class="item"><span>Meze Çeşitleri</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Deniz Ürünleri Mezesi</span><span class="item-price">450 TL</span></div>
            <div class="item"><span>Ezine Peynir (Adet)</span><span class="item-price">100 TL</span></div>`,
        'salata-cat': `
            <div class="item"><span>Mevsim Salata</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Çoban Salata</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Roka Salata</span><span class="item-price">200 TL</span></div>`,
        'arasicak-cat': `
            <div class="item"><span>Karides</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Kalamar</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Köri Patates</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Paçanga / Sigara Böreği</span><span class="item-price">150 TL</span></div>`,
        'anayemek-cat': `
            <div class="item"><span>Mezgit / Levrek / Çipura</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Sardalya</span><span class="item-price">500 TL</span></div>
            <div class="item"><span>Bonfile Saç Kavurma</span><span class="item-price">700 TL</span></div>`
    };

    function openMenu(id, title) {
        document.getElementById('overlay-title').innerText = title;
        document.getElementById('overlay-content').innerHTML = menus[id];
        document.getElementById('overlay').style.display = 'block';
        window.scrollTo(0,0);
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        document.getElementById('overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
</script>

</body>
</html>
