<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            min-height: 100vh;
        }

        /* Üst Logo Alanı */
        header {
            text-align: center;
            padding: 20px;
            border-bottom: 3px solid var(--gold);
            background: white;
        }

        .logo-img {
            max-width: 180px;
            width: 70%;
            height: auto;
        }

        .welcome-text {
            color: var(--dark-blue);
            font-weight: bold;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        /* Kategori Izgarası (Kare Butonlar) */
        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .cat-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-decoration: none;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }

        .cat-card:active {
            transform: scale(0.95);
        }

        .cat-img {
            width: 100%;
            height: 100px;
            object-fit: cover;
        }

        .cat-title {
            padding: 10px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-blue);
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        /* Ürün Listesi Alanı (Başlangıçta Gizli) */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 1000;
            overflow-y: auto;
        }

        .overlay-header {
            padding: 20px;
            background: var(--dark-blue);
            color: white;
            display: flex;
            align-items: center;
        }

        .back-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 5px 15px;
            border-radius: 5px;
            margin-right: 15px;
            cursor: pointer;
        }

        .product-list {
            padding: 20px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-name { font-weight: 500; }
        .item-price { font-weight: bold; color: var(--gold); }

        .raki-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px;}
        .raki-table th, .raki-table td { padding: 8px 2px; text-align: center; border-bottom: 1px solid #eee; }
        .raki-brand { text-align: left !important; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="main-view">
    <header>
        <img src="logo.JPG" alt="Cello Logo" class="logo-img">
        <div class="welcome-text">TAHİR'İN YERİ</div>
    </header>

    <div class="category-grid">
        <!-- RAKI -->
        <div class="cat-card" onclick="openMenu('raki-cat', 'RAKI ÇEŞİTLERİ')">
            <img src="https://images.unsplash.com/photo-1610631653554-e0b407a9b09a?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">RAKI ÇEŞİTLERİ</div>
        </div>
        <!-- İÇECEKLER -->
        <div class="cat-card" onclick="openMenu('icecek-cat', 'İÇECEKLER')">
            <img src="https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">İÇECEKLER</div>
        </div>
        <!-- MEZELER -->
        <div class="cat-card" onclick="openMenu('meze-cat', 'MEZELER')">
            <img src="https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">MEZELER</div>
        </div>
        <!-- SALATALAR -->
        <div class="cat-card" onclick="openMenu('salata-cat', 'SALATALAR')">
            <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">SALATALAR</div>
        </div>
        <!-- ARA SICAKLAR -->
        <div class="cat-card" onclick="openMenu('arasicak-cat', 'ARA SICAKLAR')">
            <img src="https://images.unsplash.com/photo-159930773417d-94d30607c397?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">ARA SICAKLAR</div>
        </div>
        <!-- ANA YEMEKLER -->
        <div class="cat-card" onclick="openMenu('anayemek-cat', 'ANA YEMEKLER')">
            <img src="https://images.unsplash.com/photo-1534604973900-c43ab4c2e0ab?auto=format&fit=crop&w=300&q=80" class="cat-img">
            <div class="cat-title">ANA YEMEKLER</div>
        </div>
    </div>
</div>

<!-- DETAY GÖRÜNÜMÜ -->
<div id="overlay" class="menu-overlay">
    <div class="overlay-header">
        <button class="back-btn" onclick="closeMenu()">← Geri</button>
        <h3 id="overlay-title" style="margin:0"></h3>
    </div>
    <div id="overlay-content" class="product-list">
        <!-- İçerik buraya JS ile gelecek -->
    </div>
</div>

<script>
    const menus = {
        'raki-cat': `
            <table class="raki-table">
                <tr><th>Marka</th><th>20cc</th><th>35cc</th><th>50cc</th><th>70cc</th><th>100cc</th></tr>
                <tr><td class="raki-brand">Efe Gold</td><td>650</td><td>1200</td><td>1500</td><td>2000</td><td>2500</td></tr>
                <tr><td class="raki-brand">Sarı Zeybek</td><td>750</td><td>1300</td><td>1750</td><td>2250</td><td>3000</td></tr>
                <tr><td class="raki-brand">B.beyi Göbek</td><td>750</td><td>1500</td><td>1900</td><td>2400</td><td>3200</td></tr>
            </table>`,
        'icecek-cat': `
            <div class="item"><span>Bira</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Meşrubatlar</span><span class="item-price">75 TL</span></div>
            <div class="item"><span>Redbull</span><span class="item-price">150 TL</span></div>`,
        'meze-cat': `
            <div class="item"><span>Meze Tabağı</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Deniz Ürünleri Mezesi</span><span class="item-price">450 TL</span></div>
            <div class="item"><span>Ezine Peynir</span><span class="item-price">100 TL</span></div>`,
        'salata-cat': `
            <div class="item"><span>Mevsim Salata</span><span class="item-price">200 TL</span></div>
            <div class="item"><span>Çoban Salata</span><span class="item-price">200 TL</span></div>`,
        'arasicak-cat': `
            <div class="item"><span>Karides Güveç</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Kalamar Tava</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Paçanga Böreği</span><span class="item-price">150 TL</span></div>`,
        'anayemek-cat': `
            <div class="item"><span>Levrek Izgara</span><span class="item-price">600 TL</span></div>
            <div class="item"><span>Bonfile Kavurma</span><span class="item-price">700 TL</span></div>
            <div class="item"><span>Çipura</span><span class="item-price">600 TL</span></div>`
    };

    function openMenu(id, title) {
        document.getElementById('overlay-title').innerText = title;
        document.getElementById('overlay-content').innerHTML = menus[id];
        document.getElementById('overlay').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        document.getElementById('overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
</script>

</body>
</html>
