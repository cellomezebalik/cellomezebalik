<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --soft-bg: #f4ede4;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--soft-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Dil Seçim Ekranı */
        .lang-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--soft-bg);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lang-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .lang-logo {
            max-width: 240px;
            width: 80%;
            height: auto;
            margin-bottom: 40px;
        }

        .lang-btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--dark-blue);
            border: 2px solid transparent;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn:active {
            transform: scale(0.96);
        }

        .lang-btn.btn-en {
            background-color: transparent;
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
        }

        /* Ana İçerik Konteyneri */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            min-height: 100vh;
            padding-bottom: 40px;
            display: none; 
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.3);
            background: transparent;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: transparent;
        }

        .cat-card {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cat-card:active { transform: scale(0.96); }

        .cat-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .cat-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-area {
            text-align: center;
            padding: 25px 20px;
            background: transparent;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
