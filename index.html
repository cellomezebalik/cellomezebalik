<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --soft-bg: #f4ede4; /* Tüm sayfanın ana rengi */
            --card-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--soft-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Dil Seçim Ekranı */
        .lang-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--soft-bg);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lang-container {
            text-align: center;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        .lang-logo {
            max-width: 240px;
            width: 80%;
            height: auto;
            margin-bottom: 40px;
        }

        .lang-btn {
            display: block;
            width: 80%;
            margin: 15px auto;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            background-color: var(--dark-blue);
            border: 2px solid transparent;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .lang-btn:active {
            transform: scale(0.96);
        }

        .lang-btn.btn-en {
            background-color: transparent;
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
        }

        /* Ana İçerik Konteyneri (İlk başta gizli, dil seçimine göre görünür) */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            min-height: 100vh;
            padding-bottom: 40px;
            display: none; 
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.3);
            background: transparent;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: transparent;
        }

        .cat-card {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cat-card:active { transform: scale(0.96); }

        .cat-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .cat-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-area {
            text-align: center;
            padding: 25px 20px;
            background: transparent;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .small-btn {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .ig-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .wa-btn { background: #25d366; }
        .google-btn { background: #4285F4; margin-top: 10px; display: inline-flex; }

        .experience-text { font-size: 15px; font-weight: bold; margin-top: 10px; color: var(--dark-blue); }
        .thanks-text { font-size: 12px; font-style: italic; color: #999; margin-top: 30px; display: block; }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 1000;
            overflow-y: auto;
        }

        .overlay-header {
            padding: 20px;
            background: var(--dark-blue);
            color: white;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .back-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 15px;
            font-weight: bold;
        }

        .product-list { padding: 25px; }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item-price { font-weight: bold; color: var(--gold); font-size: 1rem; }

        .raki-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px;}
        .raki-table th, .raki-table td { padding: 12px 2px; text-align: center; border-bottom: 1px solid #eee; }
        .raki-brand { text-align: left !important; font-weight: bold; color: var(--dark-blue); }
        
        .alkol-not {
            background: #fff9db;
            padding: 12px;
            border-radius: 10px;
            margin-top: 25px;
            font-size: 13px;
            color: #7d6608;
            text-align: center;
            border: 1px dashed #f1c40f;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div id="language-selection" class="lang-overlay">
    <div class="lang-container">
        <img src="logo.png" alt="Cello Logo" class="lang-logo">
        <button class="lang-btn btn-tr" onclick="selectLanguage('tr')">TÜRKÇE</button>
        <button class="lang-btn btn-en" onclick="selectLanguage('en')">ENGLISH</button>
    </div>
</div>

<div id="main-container" class="container">
    <header>
        <img src="logo.png" alt="Cello Logo" class="logo-img">
    </header>

    <div class="category-grid">
        <div class="cat-card" onclick="triggerMenuOpen('raki-cat')">
            <img src="raki.JPG" class="cat-img">
            <div id="title-raki-cat" class="cat-title">RAKI ÇEŞİTLERİ</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('icecek-cat')">
            <img src="icecek.JPG" class="cat-img">
            <div id="title-icecek-cat" class="cat-title">İÇECEKLER</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('meze-cat')">
            <img src="meze.JPG" class="cat-img">
            <div id="title-meze-cat" class="cat-title">MEZELER</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('salata-cat')">
            <img src="salata.JPG" class="cat-img">
            <div id="title-salata-cat" class="cat-title">SALATALAR</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('arasicak-cat')">
            <img src="arasicak.jpg" class="cat-img">
            <div id="title-arasicak-cat" class="cat-title">ARA SICAKLAR</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('anayemek-cat')">
            <img src="anayemek.JPG" class="cat-img">
            <div id="title-anayemek-cat" class="cat-title">ANA YEMEKLER</div>
        </div>
        <div class="cat-card" onclick="triggerMenuOpen('tatli-cat')">
            <img src="https://images.unsplash.com/photo-1587314168485-3236d6710814?q=80&w=400&auto=format&fit=crop" class="cat-img">
            <div id="title-tatli-cat" class="cat-title">TATLILAR</div>
        </div>
    </div>

    <div class="social-area">
        <div class="social-row">
            <a href="https://instagram.com/cellomezebalik" target="_blank" class="small-btn ig-btn">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/+905326771371" target="_blank" class="small-btn wa-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <div id="text-experience" class="experience-text">Deneyiminizi Bizlerle Paylaşın</div>
        <a href="https://www.google.com/search?client=safari&hs=QYT&sca_esv=51ecd411621d9ffb&hl=tr-tr&sxsrf=ANbL-n6oga8KuMEq0cxkKBPQZQ5mMa70rg%3A1777631857006&kgmid=%2Fg%2F11f542cp71&q=Cello%20Meze%20%26%20Bal%C4%B1k&shem=rimspwouoe&shndl=30&source=sh%2Fx%2Floc%2Fact%2Fm4%2F3" target="_blank" class="small-btn google-btn">
            <i class="fab fa-google"></i> <span id="text-google">Google Yorumları</span>
        </a>

        <span id="text-thanks" class="thanks-text">Bizleri tercih ettiğiniz için teşekkür ederiz!</span>
    </div>
</div>

<div id="overlay" class="menu-overlay">
    <div class="overlay-header">
        <button id="text-back-btn" class="back-btn" onclick="closeMenu()">← Geri</button>
        <h3 id="overlay-title" style="margin:0; text-transform: uppercase;"></h3>
    </div>
    <div id="overlay-content" class="product-list"></div>
</div>
