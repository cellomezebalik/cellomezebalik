<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cello Meze ★ Balık Menü</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --dark-blue: #002b5c;
            --gold: #c5a059;
            --soft-bg: #f4ede4;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--soft-bg);
            margin: 0;
            padding: 0;
            color: #333;
        }

        /* Dil Seçim Ekranı Tasarımı */
        .lang-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .lang-logo {
            max-width: 260px;
            width: 85%;
            height: auto;
            margin-bottom: 50px;
        }

        .lang-btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 280px;
        }

        .lang-select-btn {
            background: #ffffff;
            color: var(--dark-blue);
            border: 2px solid var(--dark-blue);
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: all 0.2s ease;
        }

        .lang-select-btn:active {
            transform: scale(0.96);
            background: var(--dark-blue);
            color: #ffffff;
        }

        /* Ana Menü Alanı */
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: transparent;
            min-height: 100vh;
            padding-bottom: 40px;
        }

        header {
            text-align: center;
            padding: 25px 20px;
            border-bottom: 2px solid rgba(197, 160, 89, 0.3);
            background: transparent;
            position: relative;
        }

        .lang-switch-back {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 1px solid var(--gold);
            color: var(--dark-blue);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .logo-img {
            max-width: 220px;
            width: 80%;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .category-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
            background: transparent;
        }

        .cat-card {
            background: #ffffff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(0,0,0,0.03);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .cat-card:active { transform: scale(0.96); }

        .cat-img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .cat-title {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            color: var(--dark-blue);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .social-area {
            text-align: center;
            padding: 25px 20px;
            background: transparent;
        }

        .social-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .small-btn {
            text-decoration: none;
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .ig-btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
        .wa-btn { background: #25d366; }
        .google-btn { background: #4285F4; margin-top: 10px; display: inline-flex; }

        .experience-text { font-size: 15px; font-weight: bold; margin-top: 10px; color: var(--dark-blue); }
        .thanks-text { font-size: 12px; font-style: italic; color: #999; margin-top: 30px; display: block; }

        .menu-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            z-index: 1000;
            overflow-y: auto;
        }

        .overlay-header {
            padding: 20px;
            background: var(--dark-blue);
            color: white;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
        }

        .back-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            margin-right: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .product-list { padding: 25px; }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 18px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .item-price { font-weight: bold; color: var(--gold); font-size: 1rem; white-space: nowrap; }

        .raki-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px;}
        .raki-table th, .raki-table td { padding: 12px 2px; text-align: center; border-bottom: 1px solid #eee; }
        .raki-brand { text-align: left !important; font-weight: bold; color: var(--dark-blue); }
    </style>
</head>
<body>

<div id="language-screen" class="lang-container">
    <img src="logo.png" alt="Cello Logo" class="lang-logo">
    <div class="lang-btn-group">
        <button class="lang-select-btn" onclick="selectLanguage('tr')">TÜRKÇE</button>
        <button class="lang-select-btn" onclick="selectLanguage('en')">ENGLISH</button>
    </div>
</div>

<div id="menu-container" class="container" style="display: none;">
    <header>
        <button class="lang-switch-back" onclick="showLanguageScreen()">🌐 TR / EN</button>
        <img src="logo.png" alt="Cello Logo" class="logo-img">
    </header>

    <div class="category-grid">
        <div class="cat-card" onclick="openMenu('raki-cat')">
            <img src="raki.JPG" class="cat-img">
            <div class="cat-title" id="title-raki-cat">RAKI ÇEŞİTLERİ</div>
        </div>
        <div class="cat-card" onclick="openMenu('icecek-cat')">
            <img src="icecek.JPG" class="cat-img">
            <div class="cat-title" id="title-icecek-cat">İÇECEKLER</div>
        </div>
        <div class="cat-card" onclick="openMenu('meze-cat')">
            <img src="meze.JPG" class="cat-img">
            <div class="cat-title" id="title-meze-cat">MEZELER</div>
        </div>
        <div class="cat-card" onclick="openMenu('salata-cat')">
            <img src="salata.JPG" class="cat-img">
            <div class="cat-title" id="title-salata-cat">SALATALAR</div>
        </div>
        <div class="cat-card" onclick="openMenu('arasicak-cat')">
            <img src="arasicak.jpg" class="cat-img">
            <div class="cat-title" id="title-arasicak-cat">ARA SICAKLAR</div>
        </div>
        <div class="cat-card" onclick="openMenu('anayemek-cat')">
            <img src="anayemek.JPG" class="cat-img">
            <div class="cat-title" id="title-anayemek-cat">ANA YEMEKLER</div>
        </div>
        <div class="cat-card" onclick="openMenu('tatli-cat')">
            <img src="https://images.unsplash.com/photo-1587314168485-3236d6710814?q=80&w=400&auto=format&fit=crop" class="cat-img">
            <div class="cat-title" id="title-tatli-cat">TATLILAR</div>
        </div>
    </div>

    <div class="social-area">
        <div class="social-row">
            <a href="https://instagram.com/cellomezebalik" target="_blank" class="small-btn ig-btn">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a href="https://wa.me/+905326771371" target="_blank" class="small-btn wa-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>
        </div>

        <div class="experience-text" id="text-experience">Deneyiminizi Bizlerle Paylaşın</div>
        <a href="https://www.google.com/search?client=safari&hs=QYT&sca_esv=51ecd411621d9ffb&hl=tr-tr&sxsrf=ANbL-n6oga8KuMEq0cxkKBPQZQ5mMa70rg%3A1777631857006&kgmid=%2Fg%2F11f542cp71&q=Cello%20Meze%20%26%20Bal%C4%B1k&shem=rimspwouoe&shndl=30&source=sh%2Fx%2Floc%2Fact%2Fm4%2F3" target="_blank" class="small-btn google-btn">
            <i class="fab fa-google"></i> <span id="text-google-btn">Google Yorumları</span>
        </a>

        <span class="thanks-text" id="text-thanks">Bizleri tercih ettiğiniz için teşekkür ederiz!</span>
    </div>
</div>

<div id="overlay" class="menu-overlay">
    <div class="overlay-header">
        <button class="back-btn" id="btn-back" onclick="closeMenu()">← Geri</button>
        <h3 id="overlay-title" style="margin:0; text-transform: uppercase;"></h3>
    </div>
    <div id="overlay-content" class="product-list"></div>
</div>

            googleBtn: "Google Yorumları",
            thanks: "Bizleri tercih ettiğiniz için teşekkür ederiz!",
            categories: {
                'raki-cat': 'RAKI ÇEŞİTLERİ',

                'icecek-cat': 'BEVERAGES',
                'meze-cat': 'APPETIZERS',
                'salata-cat': 'SALADS',
                'arasicak-cat': 'HOT APPETIZERS',
                'anayemek-cat': 'MAIN COURSES',
                'tatli-cat': 'DESSERTS'
            }
        }
    };

    var menus = {
        tr: {
            'raki-cat': '<table class="raki-table"><tr><th>Marka</th><th>20cc</th><th>35cc</th><th>50cc</th><th>70cc</th><th>100cc</th></tr><tr><td class="raki-brand">Efe Gold</td><td>650</td><td>1300</td><td>1500</td><td>2000</td><td>2500</td></tr><tr><td class="raki-brand">Sarı Zeybek</td><td>750</td><td>1500</td><td>1750</td><td>2250</td><td>3000</td></tr><tr><td class="raki-brand">Beylerbeyi Göbek</td><td>750</td><td>1500</td><td>1900</td><td>2400</td><td>3200</td></tr><tr><td class="raki-brand">Adap Rakı</td><td>600</td><td>1000</td><td>-</td><td>1800</td><td>-</td></tr></table>',
            'icecek-cat': '<div class="item"><span>Bira</span><span class="item-price">200 TL</span></div><div class="item"><span>Su, Soda</span><span class="item-price">100 TL</span></div><div class="item"><span>Kola, Fanta, Sprite, Şalgam</span><span class="item-price">100 TL</span></div><div class="item"><span>Redbull</span><span class="item-price">150 TL</span></div>',
            'meze-cat': '<div class="item"><span>Meze Çeşitleri</span><span class="item-price">200 TL</span></div><div class="item"><span>Deniz Ürünleri Mezesi</span><span class="item-price">450 TL</span></div><div class="item"><span>Ezine Peynir (Adet)</span><span class="item-price">150 TL</span></div>',
            'salata-cat': '<div class="item"><span>Mevsim Salata</span><span class="item-price">200 TL</span></div><div class="item"><span>Çoban Salata</span><span class="item-price">250 TL</span></div><div class="item"><span>Roka Salata</span><span class="item-price">200 TL</span></div>',
            'arasicak-cat': '<div class="item"><span>Karides</span><span class="item-price">600 TL</span></div><div class="item"><span>Kalamar</span><span class="item-price">600 TL</span></div><div class="item"><span>Güveçte Mantar</span><span class="item-price">500 TL</span></div><div class="item"><span>Paçanga Böreği</span><span class="item-price">150 TL</span></div><div class="item"><span>Sigara Böreği</span><span class="item-price">150 TL</span></div><div class="item"><span>Köylü Patates</span><span class="item-price">250 TL</span></div>',
            'anayemek-cat': '<div class="item"><span>Mezgit / Levrek / Çipura (Tüm çeşitler 400-450gr.)</span><span class="item-price">600 TL</span></div><div class="item"><span>Sardalya</span><span class="item-price">500 TL</span></div><div class="item"><span>Bonfile Saç Kavurma (180gr.) </span><span class="item-price">750 TL</span></div>',
            'tatli-cat': '<div class="item"><span>Kabak Tatlısı</span><span class="item-price">250 TL</span></div><div class="item"><span>İrmik Tatlısı</span><span class="item-price">250 TL</span></div><div class="item"><span>Meyve Tabağı</span><span class="item-price">250 TL</span></div>'
        },
        en: {
            'raki-cat': '<table class="raki-table"><tr><th>Brand</th><th>20cc</th><th>35cc</th><th>50cc</th><th>70cc</th><th>100cc</th></tr><tr><td class="raki-brand">Efe Gold</td><td>650</td><td>1300</td><td>1500</td><td>2000</td><td>2500</td></tr><tr><td class="raki-brand">Sarı Zeybek</td><td>750</td><td>1500</td><td>1750</td><td>2250</td><td>3000</td></tr><tr><td class="raki-brand">Beylerbeyi Göbek</td><td>750</td><td>1500</td><td>1900</td><td>2400</td><td>3200</td></tr><tr><td class="raki-brand">Adap Rakı</td><td>600</td><td>1000</td><td>-</td><td>1800</td><td>-</td></tr></table>',
            'icecek-cat': '<div class="item"><span>Beer</span><span class="item-price">200 TL</span></div><div class="item"><span>Water, Mineral Water</span><span class="item-price">100 TL</span></div><div class="item"><span>Cola, Fanta, Sprite, Shalgam (Turnip Juice)</span><span class="item-price">100 TL</span></div><div class="item"><span>Red Bull</span><span class="item-price">150 TL</span></div>',
            'meze-cat': '<div class="item"><span>Assorted Mezes (Cold Appetizers)</span><span class="item-price">200 TL</span></div><div class="item"><span>Seafood Appetizer</span><span class="item-price">450 TL</span></div><div class="item"><span>Ezine Cheese (Per Piece)</span><span class="item-price">150 TL</span></div>',

            'arasicak-cat': '<div class="item"><span>Shrimp</span><span class="item-price">600 TL</span></div><div class="item"><span>Calamari</span><span class="item-price">600 TL</span></div><div class="item"><span>Mushroom Casserole</span><span class="item-price">500 TL</span></div><div class="item"><span>Pacanga Pastry</span><span class="item-price">150 TL</span></div><div class="item"><span>Crispy Cheese Rolls</span><span class="item-price">150 TL</span></div><div class="item"><span>Country Style Potatoes</span><span class="item-price">250 TL</span></div>',

            'tatli-cat': '<div class="item"><span>Pumpkin Dessert</span><span class="item-price">250 TL</span></div><div class="item"><span>Semolina Dessert</span><span class="item-price">250 TL</span></div><div class="item"><span>Fruit Platter</span><span class="item-price">250 TL</span></div>'
        }
    };

    function selectLanguage(lang) {
        currentLang = lang;
        
        document.getElementById('btn-back').innerText = translations[lang].backBtn;
        document.getElementById('text-experience').innerText = translations[lang].experience;
        document.getElementById('text-google-btn').innerText = translations[lang].googleBtn;
        document.getElementById('text-thanks').innerText = translations[lang].thanks;

        var cats = translations[lang].categories;
        for (var key in cats) {
            if (cats.hasOwnProperty(key)) {
                var element = document.getElementById('title-' + key);
                if (element) {
                    element.innerText = cats[key];
                }
            }
        }

        document.getElementById('language-screen').style.display = 'none';
        document.getElementById('menu-container').style.display = 'block';
        window.scrollTo(0,0);
    }

    function showLanguageScreen() {
        document.getElementById('menu-container').style.display = 'none';
        document.getElementById('language-screen').style.display = 'flex';
        window.scrollTo(0,0);
    }

    function openMenu(id) {
        var title = translations[currentLang].categories[id];
        document.getElementById('overlay-title').innerText = title;
        document.getElementById('overlay-content').innerHTML = menus[currentLang][id];
        document.getElementById('overlay').style.display = 'block';
        window.scrollTo(0,0);
        document.body.style.overflow = 'hidden';
    }

    function closeMenu() {
        document.getElementById('overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }
</script>

</body>
</html>
